<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Busy Doin' Nothin'</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    .tagline {
      margin: 0;
      font-size: 16px;
    }

    main {
      margin-top: 48px;
    }

    .app-link {
      display: block;
      color: inherit;
      text-decoration: none;
      border-radius: 16px;
      margin: -16px;
      padding: 16px;
      transition: background-color 0.15s ease;
    }

    .app {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 17px;
      object-fit: cover;
    }

    .app-info {
      min-width: 0;
    }

    .app-name {
      margin: 0 0 4px;
      font-size: 26px;
      line-height: 1.25;
    }

    .app-description {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }

    @media (hover: hover) and (pointer: fine) {
      .app-link:hover {
        background: #f5f5f5;
      }
    }

    .app-link:focus-visible {
      outline: 2px solid #222;
      outline-offset: 4px;
    }

    footer {
      margin-top: 80px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 48px;
        padding-left: 20px;
        padding-right: 20px;
      }

      h1 {
        font-size: 28px;
      }

      main {
        margin-top: 40px;
      }

      .app-icon {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
        border-radius: 15px;
      }

      .app {
        gap: 16px;
      }

      .app-name {
        font-size: 23px;
      }

      .app-description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Busy Doin' Nothin'</h1>
      <p class="tagline">
        Couldn't find the apps I needed, so I made them.
      </p>
    </header>

    <main>

      <a class="app-link" href="/elegy/" aria-label="Learn more about Elegy">

        <div class="app">

          <img
            class="app-icon"
            src="/assets/elegy/icon.png"
            alt="Elegy app icon"
          >

          <div class="app-info">
            <h2 class="app-name">Elegy</h2>

            <p class="app-description">
              A writing and typesetting app for sharing your words.
            </p>
          </div>

        </div>

      </a>

    </main>

    <footer>
      © 2026 Busy Doin' Nothin'
    </footer>

  </div>

</body>
</html>
