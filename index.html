<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Busy Doin' Nothin'</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 40px;
    }

    /* Language selector */

    .language {
      position: absolute;
      top: 32px;
      right: 24px;
    }

    .language-button {
      appearance: none;
      border: 0;
      background: none;
      padding: 6px 0;
      font: inherit;
      font-size: 14px;
      color: #777;
      cursor: pointer;
    }

    .language-button:hover {
      color: #222;
    }

    .language-menu {
      position: absolute;
      top: 36px;
      right: 0;
      z-index: 10;

      min-width: 130px;
      padding: 6px;

      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;

      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);

      transition:
        opacity 0.15s ease,
        transform 0.15s ease,
        visibility 0.15s;
    }

    .language-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .language-option {
      display: block;
      width: 100%;

      border: 0;
      background: none;

      padding: 7px 10px;
      border-radius: 6px;

      text-align: left;
      font: inherit;
      font-size: 14px;

      cursor: pointer;
    }

    .language-option:hover {
      background: #f5f5f5;
    }

    /* Header */

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    .tagline {
      margin: 0;
      font-size: 16px;
    }

    /* Apps */

    main {
      margin-top: 48px;
    }

    .app-link {
      display: block;

      margin: -16px;
      padding: 16px;

      color: inherit;
      text-decoration: none;

      border-radius: 16px;

      transition:
        background-color 0.18s ease,
        transform 0.18s ease;
    }

    .app {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .app-icon {
      display: block;

      width: 76px;
      height: 76px;
      flex: 0 0 76px;

      border-radius: 17px;
      object-fit: cover;

      transition: transform 0.18s ease;
    }

    .app-info {
      min-width: 0;
    }

    .app-name {
      margin: 0 0 4px;

      font-size: 26px;
      line-height: 1.25;
    }

    .app-description {
      margin: 0;

      font-size: 16px;
      line-height: 1.5;
    }

    @media (hover: hover) and (pointer: fine) {
      .app-link:hover {
        background: #f5f5f5;
      }

      .app-link:hover .app-icon {
        transform: scale(1.06);
      }
    }

    .app-link:active {
      transform: scale(0.99);
    }

    .app-link:focus-visible {
      outline: 2px solid #222;
      outline-offset: 4px;
    }

    /* Footer */

    footer {
      margin-top: 80px;
      color: #777;
      font-size: 14px;
    }

    /* Mobile */

    @media (max-width: 600px) {
      .container {
        padding: 64px 20px 40px;
      }

      .language {
        top: 18px;
        right: 20px;
      }

      h1 {
        font-size: 28px;
      }

      main {
        margin-top: 40px;
      }

      .app-link {
        margin: -12px;
        padding: 12px;
        border-radius: 14px;
      }

      .app {
        gap: 16px;
      }

      .app-icon {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
        border-radius: 15px;
      }

      .app-name {
        font-size: 23px;
      }

      .app-description {
        font-size: 15px;
        line-height: 1.45;
      }

      footer {
        margin-top: 72px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- Language selector -->

    <div class="language">

      <button
        class="language-button"
        id="languageButton"
        aria-haspopup="true"
        aria-expanded="false"
      >
        English ▾
      </button>

      <div
        class="language-menu"
        id="languageMenu"
      >

        <button
          class="language-option"
          data-language="en"
        >
          English
        </button>

        <button
          class="language-option"
          data-language="zh-Hant"
        >
          繁體中文
        </button>

        <button
          class="language-option"
          data-language="zh-Hans"
        >
          简体中文
        </button>

      </div>

    </div>


    <!-- Header -->

    <header>

      <h1>
        Busy Doin' Nothin'
      </h1>

      <p
        class="tagline"
        data-en="Couldn't find the apps I needed, so I made them."
        data-zh-hant="找不到自己需要的 App，所以乾脆自己做。"
        data-zh-hans="找不到自己需要的 App，所以干脆自己做。"
      >
        Couldn't find the apps I needed, so I made them.
      </p>

    </header>


    <!-- Apps -->

    <main>

      <a
        class="app-link"
        href="/elegy/"
        aria-label="Learn more about Elegy"
      >

        <div class="app">

          <img
            class="app-icon"
            src="/assets/elegy/icon.png"
            alt="Elegy app icon"
          >

          <div class="app-info">

            <h2 class="app-name">
              Elegy
            </h2>

            <p
              class="app-description"
              data-en="A writing and typesetting app for sharing words on social media."
              data-zh-hant="一款為在社交平台分享文字而設的寫作與排版 App。"
              data-zh-hans="一款为在社交平台分享文字而设计的写作与排版 App。"
            >
              A writing and typesetting app for sharing words on social media.
            </p>

          </div>

        </div>

      </a>

    </main>


    <!-- Footer -->

    <footer>
      © 2026 Busy Doin' Nothin'
    </footer>

  </div>


  <script>

    const languageButton =
      document.getElementById("languageButton");

    const languageMenu =
      document.getElementById("languageMenu");

    const languageOptions =
      document.querySelectorAll(".language-option");


    function setLanguage(language) {

      /* Change text */

      document.querySelectorAll("[data-en]").forEach(element => {

        if (language === "zh-Hant") {
          element.textContent = element.dataset.zhHant;
        }

        else if (language === "zh-Hans") {
          element.textContent = element.dataset.zhHans;
        }

        else {
          element.textContent = element.dataset.en;
        }

      });


      /* Set HTML language */

      document.documentElement.lang = language;


      /* Update language button */

      if (language === "zh-Hant") {
        languageButton.textContent = "繁體中文 ▾";
      }

      else if (language === "zh-Hans") {
        languageButton.textContent = "简体中文 ▾";
      }

      else {
        languageButton.textContent = "English ▾";
      }


      /* Remember language */

      localStorage.setItem("language", language);

    }


    /* Open / close menu */

    languageButton.addEventListener("click", () => {

      const isOpen =
        languageMenu.classList.toggle("open");

      languageButton.setAttribute(
        "aria-expanded",
        isOpen
      );

    });


    /* Select language */

    languageOptions.forEach(option => {

      option.addEventListener("click", () => {

        setLanguage(
          option.dataset.language
        );

        languageMenu.classList.remove("open");

        languageButton.setAttribute(
          "aria-expanded",
          "false"
        );

      });

    });


    /* Close menu when clicking outside */

    document.addEventListener("click", event => {

      if (!event.target.closest(".language")) {

        languageMenu.classList.remove("open");

        languageButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    });


    /* Load saved language */

    const savedLanguage =
      localStorage.getItem("language");


    if (
      savedLanguage === "zh-Hant" ||
      savedLanguage === "zh-Hans"
    ) {

      setLanguage(savedLanguage);

    }

    else {

      setLanguage("en");

    }

  </script>

</body>
</html>
